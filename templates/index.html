<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP - Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body { background: #f7f9fc; font-family: Arial, sans-serif; }
        .main-card { max-width: 900px; margin: 3rem auto; }
        .center-heading { text-align: center; margin: 15px 0 30px; }
        .result-container { margin-top: 24px; padding: 20px; background: #f8f9fa; border-radius: 8px; min-height: 90px; }
        #system_response { white-space: pre-wrap; overflow-wrap: break-word; }
    </style>
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
    <main class="container">
        <div class="card main-card shadow-sm">
            <div class="card-body p-4">
                <h1 class="center-heading">NLP - Emotion Detection</h1>
                <label for="textToAnalyze" class="h4">Please enter the text to be analyzed</label>
                <input class="form-control" type="text" id="textToAnalyze" placeholder="Enter text to analyze" value="I think I am having fun">
                <button type="button" class="btn btn-secondary mt-4" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
                <h2 class="mt-5 h4">Result of Emotion Detection</h2>
                <div class="result-container" aria-live="polite"><div id="system_response">Enter a text and click the button to analyze emotions.</div></div>
            </div>
        </div>
    </main>
</body>
</html>
